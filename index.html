#app{position:absolute;left:18.4%;top:18.3%;width:63.1%;height:63.3%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:2px 4px 2px}
.screen.on{display:flex}
h1{font-size:clamp(14px,4.41vh,38px);margin:0;line-height:1.05}
h2{font-size:clamp(14px,5.04vh,40px);margin:0;line-height:1.05}
p{margin:6px 0;color:var(--muted);font-size:clamp(8px,2.52vh,18px);font-weight:500}
.deco{position:absolute;pointer-events:none;opacity:.9;z-index:0}
.screen>*:not(.deco){position:relative;z-index:1}
/* iOS home */
.sb{display:flex;justify-content:space-between;font-weight:600;font-size:14px;padding:2px 6px}
.homebody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.homebody img.logo{height:clamp(22px,8.19vh,64px)}
.apps{display:flex;gap:clamp(14px,4.41vw,64px);justify-content:center}
.mode{background:none;border:0;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;width:clamp(54px,13.86vw,140px);padding:0}
.mode .ic{width:clamp(42px,15.12vh,104px);height:clamp(42px,15.12vh,104px);background-size:contain;background-repeat:no-repeat;background-position:center;display:grid;place-items:center;font-size:clamp(18px,6.3vh,48px);transition:transform .15s}
.mode:active .ic{transform:scale(.88)}
.mode b{font-size:clamp(8px,2.39vh,16px);font-weight:600}
.dock{align-self:center;display:flex;align-items:center;gap:10px;background:var(--paper);backdrop-filter:blur(8px);border-radius:26px;padding:8px 22px;font-weight:600;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(17,17,17,.3)}.dots i:first-child{background:var(--ink)}
/* shared */
.back{background:none;border:0;font:inherit;font-weight:600;font-size:15px;color:var(--ink);padding:4px 0;cursor:pointer}
.tag{background:var(--ink);color:var(--yellow);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600}
.steps{display:flex;gap:6px}
.steps div{text-align:center;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--paper);color:var(--muted);white-space:nowrap}
.steps div.cur{background:var(--yellow);color:var(--ink)}.steps div.done{background:var(--teal);color:#fff}
.btn{font:inherit;font-weight:700;font-size:clamp(10px,3.15vh,22px);border:0;border-radius:99px;padding:clamp(6px,1.89vh,15px) 26px;background:var(--ink);color:var(--yellow);cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.go{background:var(--blue);color:#fff}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.big{width:100%}
.btn:disabled{background:rgba(17,17,17,.15);color:rgba(17,17,17,.4);cursor:not-allowed;transform:none}
.split{flex:1;display:flex;align-items:center;gap:28px;min-height:0}
.split>div{flex:1}
.hero{height:clamp(72px,30.24vh,220px);aspect-ratio:1;flex:none!important;display:grid;place-items:center;font-size:clamp(36px,13.86vh,110px);background-size:contain;background-repeat:no-repeat;background-position:center;margin:0 auto}
/* play */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.main{flex:1;display:flex;gap:16px;min-height:0;margin-top:8px}
.stage{flex:1.35;background:var(--paper);border-radius:28px;padding:14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;min-width:0}
.side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;justify-content:space-between}
.sidemid{display:flex;flex-direction:column;gap:8px}
.bar{height:12px;background:rgba(255,255,255,.6);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:99px;transition:width .4s}
.train{display:flex;gap:12px;position:relative;transition:transform 1.3s cubic-bezier(.6,0,.9,.6)}
.train::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;background:var(--ink);transform:translateY(-50%);border-radius:3px}
.train.go{transform:translateX(-140%)}
.u{flex:1;height:clamp(38px,15.12vh,92px);border-radius:20px;background:var(--sky);position:relative;display:grid;place-items:center;font-weight:700;font-size:clamp(17px,6.3vh,44px);color:var(--ink);z-index:1}
.u.loco{background:var(--blue);border-radius:44px 18px 18px 44px;color:#fff}
.u .stripe{position:absolute;left:0;right:0;top:40%;height:20%;background:var(--yellow)}
.u .panel{position:absolute;inset:14% 14%;border-radius:12px;background:rgba(17,17,17,.2);pointer-events:none}
.u .win{position:absolute;left:9px;top:22%;bottom:22%;width:12px;border-radius:8px 3px 3px 8px;background:var(--ink)}
.u>.lt{position:relative;z-index:2}
.u .ov{position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:opacity .4s;overflow:hidden}
.dirt{background:radial-gradient(circle at 20% 30%,#6b4526 0 9px,transparent 10px),radial-gradient(circle at 65% 65%,#5c3a1e 0 12px,transparent 13px),radial-gradient(circle at 80% 25%,#7a5230 0 7px,transparent 8px),radial-gradient(circle at 40% 80%,#6b4526 0 8px,transparent 9px),rgba(122,82,48,.35)}
.foam{background:radial-gradient(circle at 25% 35%,#fff 0 12px,transparent 13px),radial-gradient(circle at 60% 60%,#fff 0 15px,transparent 16px),radial-gradient(circle at 80% 30%,#fff 0 10px,transparent 11px),radial-gradient(circle at 45% 20%,#fff 0 9px,transparent 10px),rgba(255,255,255,.7)}
.wet{background:rgba(132,216,252,.55)}
.spark{position:absolute;top:-12px;right:-4px;font-size:22px;opacity:0;transition:opacity .4s;z-index:3}
.u.clean .spark{opacity:1}
.u.slot{background:rgba(255,255,255,.55);color:rgba(17,17,17,.35);outline:3px dashed rgba(17,17,17,.35);outline-offset:-5px}
.u.fill{color:var(--ink)}
.u.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.spot{position:absolute;width:38px;height:38px;border-radius:50%;border:0;font-size:18px;font-weight:700;display:grid;place-items:center;cursor:pointer;z-index:4;padding:0;font-family:inherit;transform:translate(-50%,-50%)}
.spot.bad{background:var(--deep);color:#fff;animation:pulse 1s infinite}.spot.ok{background:var(--lime);color:var(--ink)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,106,0,.3)}}
.road{height:10px;margin-top:18px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--ink) 0 18px,transparent 18px 30px);opacity:.3;animation:road linear infinite}
@keyframes road{to{background-position:-60px 0}}
.label{font-size:12px;text-align:center;color:var(--muted);margin-top:8px;font-weight:500;min-height:15px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px}
.tool{font:inherit;background:var(--paper);color:var(--ink);border:0;border-radius:20px;padding:6px 2px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .12s}
.tool em{font-style:normal;font-size:clamp(12px,4.41vh,28px)}
.tool:active{transform:scale(.93)}
.tool.sel{background:var(--yellow)}
.panelbox{background:var(--paper);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:14px}
.panelbox input[type=range]{flex:1;min-width:0;accent-color:var(--blue);height:24px}
.mini{font:inherit;border:0;border-radius:99px;padding:7px 12px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.mini.off{background:rgba(17,17,17,.2);color:var(--ink)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:8px;max-width:70%;background:var(--ink);color:var(--yellow);padding:8px 18px;border-radius:99px;font-weight:600;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.on{opacity:1}
#rotate{position:fixed;inset:0;z-index:99;background:var(--yellow);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-weight:600;font-size:22px;padding:30px}
#rotate span{font-size:70px;display:block;animation:rot 2s infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}

.top{height:30px;flex:none}
#controls{margin-top:8px;flex:none}
.tools{display:flex;gap:clamp(5px,1.64vw,22px);justify-content:center}
.tool{width:clamp(34px,10.71vh,78px);height:clamp(34px,10.71vh,78px);border-radius:22px;padding:0;justify-content:center;font-size:clamp(7px,2.02vh,13px)}
.tool:disabled{opacity:.35;cursor:not-allowed}.tool.off{opacity:.5}
.stage{flex:1;margin:10px 0;border-radius:26px;position:relative}
.bar{margin-bottom:8px;flex:none}
.foot{display:flex;justify-content:center;flex:none}.foot .btn{width:clamp(132px,25.2vw,320px)}
.u.slot{background:rgba(255,255,255,.8)}

.sv{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
i[data-i]{display:inline-flex;font-style:normal}
.btn,.back{display:inline-flex;align-items:center;gap:7px;justify-content:center}
.sb .r{display:flex;gap:6px;font-size:18px}
.mode .ic .sv,#sIcon .sv{width:50%;height:50%;stroke-width:1.9}
.mode .ic i{display:contents}
.tool em{display:flex}
.starbig{font-size:clamp(30px,12.6vh,90px);display:flex;justify-content:center;color:var(--yellow)}.starbig .sv{fill:var(--yellow);stroke:var(--ink)}
.dock{align-items:center}.dock .sv{font-size:20px}
#rotate span{display:flex}#rotate .sv{width:70px;height:70px}
.spot{width:42px;height:42px}.spot .sv{width:22px;height:22px}.spot.bad{color:#fff}
.nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;background:var(--ink);color:var(--yellow);font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap;pointer-events:none}
.spot.shake{animation:sshake .35s}@keyframes sshake{25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
.spot.fixing{background:var(--yellow);color:var(--ink);animation:none}.spot.fixing svg{animation:spin .75s ease-in-out}
.spot.fixing::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--yellow);animation:ring .75s ease-out}
@keyframes spin{to{transform:rotate(360deg) scale(1.35)}}@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(2.4);opacity:0}}
.fx{position:fixed;width:18px;height:18px;margin:-9px;pointer-events:none;z-index:50;animation:fly .85s ease-out forwards}
.fx svg{width:100%;height:100%}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(120deg);opacity:0}}
.cv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#tr{touch-action:none;cursor:grab}
.u.clean{box-shadow:0 0 0 4px var(--yellow)}
.u:has(.spot){z-index:3}

/* V4 compact sizes inside the safe area */
.top{height:24px}.back{font-size:12px;padding:0}.steps div{font-size:10px;padding:3px 9px}.tag{font-size:10px;padding:2px 9px}
.sb{font-size:11px;padding:0 2px;align-items:center}.sb .r{font-size:15px;align-items:center}.fsb{background:none;border:0;padding:0;color:var(--ink);display:flex;font-size:15px;cursor:pointer}
.homebody{gap:1.2vh}.mode b{font-size:11px}.dock{font-size:11px;padding:5px 16px;border-radius:20px}.dock .sv{font-size:15px}.dots{margin:2px 0 4px}
p{font-size:12px;margin:3px 0}
.btn{font-size:15px;padding:8px 22px}.foot .btn{width:clamp(150px,34vw,260px)}
#controls{margin-top:4px}.tool{font-size:9px}.tool em{font-size:clamp(12px,4.4vh,24px)}
.stage{margin:5px 0;padding:8px;border-radius:20px}.bar{height:7px;margin-bottom:4px}
.u{height:clamp(38px,13vh,80px)}.road{margin-top:8px;height:7px}.label{font-size:10px;margin-top:4px;min-height:12px}
.spot{width:32px;height:32px}.spot .sv{width:17px;height:17px}.nm{font-size:9px;padding:0 7px;margin-top:3px}
.toast{font-size:12px;padding:6px 14px;top:2px}
.hero{height:clamp(70px,30vh,200px)}
</style>
</head>

abc:'<path d="M3 18 7.5 6 12 18M4.8 14h5.4M15 6v12h3.2a3 3 0 0 0 0-6H15"/>',
bubbles:'<circle cx="9" cy="14" r="5"/><circle cx="17" cy="7" r="3"/><circle cx="18.5" cy="17" r="2"/>',
wind:'<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/>',
spark:'<path d="M12 3l2.4 6.2L21 12l-6.6 2.8L12 21l-2.4-6.2L3 12l6.6-2.8z"/>',
play:'<path d="M7 4l13 8-13 8z"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',
home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
redo:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',

battery:'<rect x="2" y="7" width="18" height="10" rx="2.5"/><path d="M22 11v2"/>',
signal:'<path d="M4 18v-3M9 18v-6M14 18V9M19 18V5"/>'};
const I=(n,x='')=>`<svg class="sv ${x}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
$$('[data-i]').forEach(e=>e.innerHTML=I(e.dataset.i));
const FX={bubble:'<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="rgba(255,255,255,.9)" stroke="#84d8fc" stroke-width="1.2"/></svg>',
 drop:'<svg viewBox="0 0 24 24" fill="#84d8fc"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>',
 spark:'<svg viewBox="0 0 24 24" fill="#ffe000" stroke="#111" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l2.4 6.2L21 12l-6.6 2.8L12 21l-2.4-6.2L3 12l6.6-2.8z"/></svg>'};
function fx(x,y,k,n=1){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='fx';e.innerHTML=FX[k];
 e.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*90}px;--dy:${k=='drop'?25+Math.random()*40:-20-Math.random()*50}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),850)}}
const M={
 eng:{name:'Engineer Mode',icon:'wrench',desc:'Three parts are broken! Pick the right tool, then tap each glowing part on the train to fix it.'},
 spell:{name:'Spelling Railway',icon:'abc',desc:'Each wagon needs one letter. Tap the letter tiles in order to spell the word.'},
 clean:{name:'Train Cleaning',icon:'bubbles',desc:'The train is muddy! Rub the screen with your finger: scrub, rinse, then dry.'}
};
let mode=null, st={}, audio;
(function c(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(c,30000)})();
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1700)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function beep(f=440,d=.18){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';g.gain.value=.08;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function say(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}
function setProg(p){$('#prog').style.width=Math.round(p*100)+'%'}
function ready(ok){$('#deploy').disabled=!ok}
function unit(cls,inner){return `<div class="u ${cls}">${inner}</div>`}
function pickTool(t){st.tool=t;$$('.tool[data-t]').forEach(x=>x.classList.toggle('sel',x.dataset.t===t))}

$$('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('#sIcon').innerHTML=I(M[mode].icon);$('#sIcon').style.backgroundImage=b.querySelector('.ic').style.backgroundImage;$('#sTitle').textContent=M[mode].name;$('#sDesc').textContent=M[mode].desc;show('start')});
$$('[data-home]').forEach(b=>b.onclick=()=>show('home'));
$('#startBtn').onclick=()=>{$('#pTag').textContent=M[mode].name;$('#trainWrap').innerHTML='';$('#controls').innerHTML='';$('#road').style.animationDuration='0s';setProg(0);ready(false);show('play');({eng,spell,clean})[mode]()};
$('#quit').onclick=()=>show('home');
$('#again').onclick=()=>$('#startBtn').click();
$('#deploy').onclick=()=>{if($('#deploy').disabled)return;beep(660,.3);$('.train').classList.add('go');$('#road').style.animationDuration='.3s';
 setTimeout(()=>{$('#dMsg').textContent=st.msg||'Great job, engineer!';show('done')},1400)};

/* Mode 1 */
function eng(){
 st={fixed:{},tool:null,sp:0,light:true,msg:'Everything is fixed and the train is rolling.'};
 const faults=[{id:'lamp',tool:'bulb',icon:'sun',x:'4%',y:'50%',host:0,name:'Headlight'},{id:'link',tool:'wrench',icon:'link',x:'104%',y:'50%',host:0,name:'Coupling'},{id:'fan',tool:'drop',icon:'fan',x:'50%',y:'50%',host:1,name:'Roof fan'}];
 $('#trainWrap').innerHTML=`<div class="train">`+[0,1,2].map(i=>unit(i?'':'loco',`<div class="stripe"></div><div class="panel"></div>${i==0?'<div class="win"></div>':''}`+faults.filter(f=>f.host==i).map(f=>`<button class="spot bad" data-f="${f.id}" style="left:${f.x};top:${f.y}">${I(f.icon)}<span class="nm">${f.name}</span></button>`).join(''))).join('')+`</div>`;
 $('#controls').innerHTML=`<div class="tools"><button class="tool" data-t="wrench"><em>${I('wrench')}</em>Wrench</button><button class="tool" data-t="drop"><em>${I('drop')}</em>Oil</button><button class="tool" data-t="bulb"><em>${I('bulb')}</em>Bulb</button><button class="tool" id="thr" disabled><em>${I('gauge')}</em><span id="spd">Stop</span></button><button class="tool" id="horn"><em>${I('horn')}</em>Horn</button><button class="tool" id="lamp"><em>${I('sun')}</em>Lights</button></div>`;
 const upd=()=>{const n=Object.keys(st.fixed).length;setProg(n/3);ready(n==3);$('#thr').disabled=n<3;$('#status').textContent=n<3?`${n}/3 fixed. Tap a glowing part to fix it.`:'All fixed! Try the throttle, then Deploy.'};
 $$('.tool[data-t]').forEach(b=>b.onclick=()=>pickTool(b.dataset.t));
 $$('.spot').forEach(b=>b.onclick=()=>{const f=faults.find(x=>x.id===b.dataset.f);if(st.fixed[f.id]||b.classList.contains('fixing'))return;
  if(!st.tool){toast(`Pick a tool to fix the ${f.name}`);shake(b);return}
  if(st.tool!==f.tool){toast(`The ${f.name} needs a different tool`);shake(b);beep(150,.2);return}
  b.classList.add('fixing');beep(660,.1);const r=b.getBoundingClientRect();fx(r.left+r.width/2,r.top+r.height/2,'spark',10);
  setTimeout(()=>{st.fixed[f.id]=1;b.className='spot ok';b.querySelector('svg').outerHTML=I('check');fx(r.left+r.width/2,r.top+r.height/2,'spark',6);beep(880,.12);toast(`${f.name} fixed!`);upd()},750)});
 $('#thr').onclick=()=>{st.sp=(st.sp+1)%4;$('#spd').textContent=['Stop','Slow','Medium','Fast'][st.sp];$('#road').style.animationDuration=st.sp?(2.4-st.sp*.7)+'s':'0s'};
 $('#horn').onclick=()=>{beep(330,.35);setTimeout(()=>beep(392,.35),120)};
 $('#lamp').onclick=()=>{st.light=!st.light;$('#lamp').classList.toggle('off',!st.light)};
 upd();
}

/* Mode 2 */
const WORDS=['CAT','DOG','SUN','BUS','PIG','HAT','FISH','STAR','BIRD','FROG','LION','DUCK','MILK','SHIP'],COLS=['#ffe000','#b7df16','#ffa300','#84d8fc','#ff6a00'];
function spell(){
 const w=WORDS[Math.floor(Math.random()*WORDS.length)];
 st={w,i:0,msg:`You spelled “${w}”. All aboard!`};
 $('#trainWrap').innerHTML=`<div class="train">`+[...w].map((c,i)=>unit((i?'':'loco ')+'slot',`<span class="lt">?</span>`)).join('')+`</div>`;
 const tiles=[...w].map(c=>c).sort(()=>Math.random()-.5);
 $('#controls').innerHTML=`<div class="tools">`+tiles.map(c=>`<button class="tool" data-c="${c}" style="font-size:24px">${c}</button>`).join('')+`</div>`;
 $('#status').textContent='Spell: '+'_ '.repeat(w.length).trim();
 $$('#controls .tool').forEach(b=>b.onclick=()=>{if(b.disabled)return;
  if(b.dataset.c!==w[st.i]){shake(b);beep(150,.2);toast('Not this one, try another letter');return}
  const u=$$('.u')[st.i];u.className='u fill pop'+(st.i?'':' loco');u.style.background=COLS[st.i%COLS.length];u.querySelector('.lt').textContent=b.dataset.c;
  b.disabled=true;beep(520+st.i*110,.15);say(b.dataset.c);st.i++;setProg(st.i/w.length);
  $('#status').textContent=[...w].map((c,i)=>i<st.i?c:'_').join(' ');
  if(st.i==w.length){ready(true);toast('Word complete! Hit Deploy');setTimeout(()=>say(w),500)}});
}

/* Mode 3: touch scrubbing */
function clean(){
 st={tool:'sponge',used:{},msg:'Sparkling clean! The train looks brand new.',done:false};
 $('#trainWrap').innerHTML=`<div class="train" id="tr">`+[0,1,2,3].map(i=>unit(i?'':'loco',`<div class="stripe"></div><div class="panel"></div>`)).join('')+`</div>`;
 $('#controls').innerHTML=`<div class="tools"><button class="tool sel" data-t="sponge"><em>${I('bubbles')}</em>Sponge</button><button class="tool" data-t="water"><em>${I('drop')}</em>Water</button><button class="tool" data-t="towel"><em>${I('wind')}</em>Towel</button></div>`;
 $$('.tool[data-t]').forEach(b=>b.onclick=()=>pickTool(b.dataset.t));
 $('#status').textContent='Rub the mud with your finger!';
 requestAnimationFrame(()=>{
  const tr=$('#tr');if(!tr)return;const W=tr.offsetWidth,H=tr.offsetHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  const mk=z=>{const c=document.createElement('canvas');c.width=W*dpr;c.height=H*dpr;c.className='cv';c.style.zIndex=z;tr.appendChild(c);const x=c.getContext('2d');x.scale(dpr,dpr);x.lineCap=x.lineJoin='round';return [c,x]};
  const [cs,xs]=mk(2),[cd,xd]=mk(3),[cf,xf]=mk(4);
  $$('#tr .u').forEach(u=>{const l=u.offsetLeft,t=u.offsetTop,w=u.offsetWidth,h=u.offsetHeight;xd.save();xd.beginPath();xd.roundRect?xd.roundRect(l,t,w,h,18):xd.rect(l,t,w,h);xd.clip();
   xd.fillStyle='rgba(110,75,40,.6)';xd.fillRect(l,t,w,h);xd.fillStyle='rgba(88,56,28,.95)';
   for(let i=0;i<14;i++){xd.beginPath();xd.arc(l+Math.random()*w,t+Math.random()*h,5+Math.random()*12,0,7);xd.fill()}
   for(let k=0;k<2;k++){const ex=l+14+Math.random()*(w-28),ey=t+14+Math.random()*(h-28);xd.fillStyle='#4a2d14';xd.beginPath();xd.arc(ex,ey,11,0,7);xd.fill();
    [-4,4].forEach(o=>{xd.fillStyle='#fff';xd.beginPath();xd.arc(ex+o,ey-2,3.6,0,7);xd.fill();xd.fillStyle='#111';xd.beginPath();xd.arc(ex+o,ey-1.5,1.6,0,7);xd.fill()})}
   xd.restore()});
  const sm=document.createElement('canvas');sm.width=96;sm.height=Math.max(8,Math.round(96*H/W));const sx=sm.getContext('2d',{willReadFrequently:true});
  const cover=c=>{sx.clearRect(0,0,sm.width,sm.height);sx.drawImage(c,0,0,sm.width,sm.height);const d=sx.getImageData(0,0,sm.width,sm.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>70)n++;return n};
  const base=Math.max(1,cover(cd));
  const check=()=>{if(st.done)return;const d=cover(cd)/base,f=cover(cf)/base,s=cover(cs)/base;
   const dd=d<.06,ff=f<.06,ss=s<.06;
   setProg((1-Math.min(1,d))*.5+(dd?((1-Math.min(1,f))*.25+(1-Math.min(1,s))*.25):0));
   let next=!dd?'sponge':!ff?'water':!ss?'towel':null;
   $('#status').textContent=!dd?'Scrub the mud off with the sponge':!ff?'Rinse the foam away with water':!ss?'Dry it with the towel':'';
   if(st.used.sponge&&dd&&st.tool==='sponge'&&!st.hinted){st.hinted=1;pickTool('water')}
   if(st.used.water&&ff&&st.tool==='water'&&!st.hinted2){st.hinted2=1;pickTool('towel')}
   if(dd&&ff&&ss&&st.used.sponge&&st.used.water&&st.used.towel){st.done=true;ready(true);setProg(1);$('#status').textContent='Spotless! Hit Deploy.';toast('Squeaky clean! Hit Deploy');beep(880,.25);
    $$('#tr .u').forEach(u=>{u.classList.add('clean');const r=u.getBoundingClientRect();fx(r.left+r.width/2,r.top+r.height/2,'spark',5)})}};
  let last=null,drag=false,tick=0;
  const pos=e=>{const r=tr.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const seg=(a,b,e)=>{const t=st.tool,dist=Math.hypot(b[0]-a[0],b[1]-a[1]);st.used[t]=1;
   const line=(x,w,op)=>{x.globalCompositeOperation=op;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
   if(t==='sponge'){line(xd,40,'destination-out');xf.globalCompositeOperation='source-over';for(let i=0;i<=dist/9;i++){const k=dist?i*9/dist:0,px=a[0]+(b[0]-a[0])*k+(Math.random()-.5)*22,py=a[1]+(b[1]-a[1])*k+(Math.random()-.5)*22;xf.beginPath();xf.arc(px,py,4+Math.random()*7,0,7);xf.fillStyle='rgba(255,255,255,.95)';xf.fill();xf.strokeStyle='rgba(132,216,252,.9)';xf.lineWidth=1.4;xf.stroke()}
    if(Math.random()<.35)fx(e.clientX,e.clientY,'bubble')}
   else if(t==='water'){line(xf,48,'destination-out');xs.strokeStyle='rgba(132,216,252,.55)';line(xs,48,'source-over');if(Math.random()<.4)fx(e.clientX,e.clientY,'drop')}
   else{line(xs,48,'destination-out');if(Math.random()<.3)fx(e.clientX,e.clientY,'spark')}};
  tr.addEventListener('pointerdown',e=>{if(st.done)return;drag=true;tr.setPointerCapture(e.pointerId);last=pos(e);seg(last,[last[0]+.1,last[1]],e)});
  tr.addEventListener('pointermove',e=>{if(!drag||st.done)return;const p=pos(e);seg(last,p,e);last=p;if(++tick%12==0)check()});
  const end=()=>{drag=false;check()};tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',end);
  check();
 });
}

/* Full screen (hides browser bars where the browser allows it) */
function goFull(){const d=document.documentElement;try{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{})}catch(e){}try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
function noFull(){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
const isFull=()=>document.fullscreenElement||document.webkitFullscreenElement;
$('#fs').onclick=e=>{e.stopPropagation();isFull()?noFull():goFull()};
addEventListener('pointerdown',e=>{if(!e.target.closest('#fs')&&!isFull())goFull()});
</script>
